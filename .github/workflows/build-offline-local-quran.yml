name: Verify Mümin Duası source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_URL: https://mooreunivers.com.tr/media/mumin-duasi/kani-karaca

    steps:
      - name: Checkout protected source
        uses: actions/checkout@v4
        with:
          ref: source-v0206
          fetch-depth: 1

      - name: Reconstruct Flutter source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, glob, json, os
          for bundle in sorted(glob.glob("source-bundles/*.json")):
              data=json.load(open(bundle,"r",encoding="utf-8"))
              for p, encoded in data.items():
                  parent=os.path.dirname(p)
                  if parent: os.makedirs(parent,exist_ok=True)
                  open(p,"wb").write(base64.b64decode(encoded))
          PY

      - name: Verify MOORE D audio endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/quran-audio-manifest.json" -o /tmp/m.json
          python3 - <<'PY'
          import json
          m=json.load(open("/tmp/m.json","r",encoding="utf-8"))
          assert m["count"] == 114
          assert len(m["files"]) == 114
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Compile check only
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          if [ -d test ]; then flutter test; fi
          flutter build apk --release --build-name=0.20.8 --build-number=2028             --dart-define=QURAN_AUDIO_BASE_URL="$BASE_URL"
          echo "CI artifact is NOT a distribution APK. Local MOORE signing is required."
